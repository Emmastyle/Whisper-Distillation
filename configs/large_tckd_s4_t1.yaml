# TCKD-only with whisper-large teacher
# S4 = 4-layer student decoder
# Temperature = 1.0
# Alpha = 1.0 (TCKD-only), Beta = 0.0 (NO NCKD), Gamma = 0.0 (NO CE)
# Top-k = 64 (kept for parity across experiments)

model:
  teacher_model: "openai/whisper-large"
  student_decoder_layers: 4
  student_decoder_heads: 16
  student_hidden_size: 1024
  dropout: 0.1

data:
  dataset_name: "librispeech_asr"
  dataset_config: "clean"
  split: "train.100"
  num_samples: null
  max_duration: 10.0
  batch_size: 16
  num_workers: 8
  sample_rate: 16000

training:
  epochs: 15
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  gradient_clip: 1.0
  log_interval: 100
  eval_interval: 1000
  save_interval: 2000
  output_dir: "./outputs/large_tckd_s4_t1"
  seed: 42
  fp16: true

dkd:
  temperature: 1.0
  alpha: 1.0  # TCKD-only
  beta: 0.0   # NO NCKD
  gamma: 0.0  # NO CE
  topk: 64



# KD (Knowledge Distillation) Training Configuration
# Whisper-tiny teacher + 2-layer student decoder

data:
  dataset_name: "librispeech_asr"
  dataset_config: "clean"
  split: "train.100"
  num_samples: 1000  # Use 1000 samples for quick iteration
  max_duration: 10.0  # Maximum 10 seconds per sample
  batch_size: 8
  num_workers: 4
  sample_rate: 16000

model:
  teacher_model: "openai/whisper-tiny"
  student_decoder_layers: 2
  student_decoder_heads: 4
  student_hidden_size: 384  # whisper-tiny hidden size
  dropout: 0.1

training:
  epochs: 10
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_clip: 1.0
  log_interval: 20
  eval_interval: 200
  save_interval: 500
  output_dir: "./outputs/kd_tiny_s2"
  seed: 42
  fp16: true

kd:
  temperature: 2.0
  alpha: 0.5  # 0.5 * CE + 0.5 * KD


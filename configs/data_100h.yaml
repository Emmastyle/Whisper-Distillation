# LibriSpeech train-clean-100 完整数据配置
# 用于 Phase 2: Standard KD Complete Version

data:
  dataset_name: "librispeech_asr"
  dataset_config: "clean"
  split: "train.100"
  
  # 使用全部数据
  num_samples: null
  
  # 时长限制（保持与 Phase 1 一致）
  max_duration: 10.0  # 秒
  
  # 采样率
  sample_rate: 16000
  
  # 与历史实验保持一致：最多保留 100 条作为验证集，不创建测试集
  validation_size: 100
  
  # DataLoader 配置
  batch_size: 16      # 增大 batch size（Phase 1 是 8）
  num_workers: 8      # 增加并行加载
  pin_memory: true

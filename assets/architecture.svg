<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Whisper decoder distillation architecture</title>
  <desc id="desc">Audio passes through a frozen Whisper encoder. A frozen teacher decoder and a trainable student decoder receive the shared representation. The student learns through CE, KD, or DKD.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#0f172a}.label{font:600 17px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.loss{font:600 15px system-ui,sans-serif;fill:#fff}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="500" rx="24" fill="#f8fafc"/>
  <text x="550" y="44" text-anchor="middle" class="title">Frozen-Encoder Decoder Distillation</text>

  <rect x="35" y="190" width="145" height="82" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="108" y="222" text-anchor="middle" class="label">Audio</text>
  <text x="108" y="246" text-anchor="middle" class="small">log-Mel features</text>

  <rect x="245" y="175" width="210" height="112" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="218" text-anchor="middle" class="label">Whisper Encoder</text>
  <text x="350" y="245" text-anchor="middle" class="small">frozen · shared</text>

  <rect x="540" y="82" width="220" height="102" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="650" y="121" text-anchor="middle" class="label">Teacher Decoder</text>
  <text x="650" y="148" text-anchor="middle" class="small">frozen · soft targets</text>

  <rect x="540" y="286" width="220" height="102" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="650" y="325" text-anchor="middle" class="label">Student Decoder</text>
  <text x="650" y="352" text-anchor="middle" class="small">2 / 3 / 4 layers · trainable</text>

  <rect x="855" y="82" width="190" height="52" rx="12" fill="#2563eb"/>
  <text x="950" y="114" text-anchor="middle" class="loss">KD · soft logits</text>
  <rect x="855" y="161" width="190" height="65" rx="12" fill="#7c3aed"/>
  <text x="950" y="188" text-anchor="middle" class="loss">DKD</text>
  <text x="950" y="209" text-anchor="middle" class="loss">target / non-target</text>
  <rect x="855" y="310" width="190" height="52" rx="12" fill="#16a34a"/>
  <text x="950" y="342" text-anchor="middle" class="loss">CE · transcripts</text>

  <path d="M180 231 H245" class="line"/>
  <path d="M455 215 C495 215 495 133 540 133" class="line"/>
  <path d="M455 247 C495 247 495 337 540 337" class="line"/>
  <path d="M760 133 H855" class="line"/>
  <path d="M760 133 C805 133 805 193 855 193" class="line"/>
  <path d="M855 108 C810 108 810 305 760 320" class="line"/>
  <path d="M855 193 C810 193 810 337 760 337" class="line"/>
  <path d="M855 336 H760" class="line"/>

  <text x="350" y="425" text-anchor="middle" class="small">Encoder features are reused; only the student decoder is optimized.</text>
  <text x="350" y="449" text-anchor="middle" class="small">CE uses labels · KD matches full distributions · DKD separates target and non-target transfer.</text>
</svg>

# DKD (Decoupled Knowledge Distillation) with whisper-large teacher
# S4 = 4-layer student decoder
# Temperature = 1.0
# Alpha = 0.5 (TCKD weight), Beta = 2.0 (NCKD weight), Gamma = 0.6 (CE weight)
# Top-k = 64 (non-target logits retained in NCKD)

model:
  teacher_model: "openai/whisper-large"
  student_decoder_layers: 4
  student_decoder_heads: 16
  student_hidden_size: 1024
  dropout: 0.1

data:
  dataset_name: "librispeech_asr"
  dataset_config: "clean"
  split: "train.100"
  num_samples: null
  max_duration: 10.0
  batch_size: 16
  num_workers: 8
  sample_rate: 16000

training:
  epochs: 15
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  gradient_clip: 1.0
  log_interval: 100
  eval_interval: 1000
  save_interval: 2000
  output_dir: "./outputs/large_dkd_s4_t1_a05_b20_g06"
  seed: 42
  fp16: true

dkd:
  temperature: 1.0
  alpha: 0.5
  beta: 2.0
  gamma: 0.6
  topk: 64



# DKD (Decoupled Knowledge Distillation) with whisper-large teacher
# S2 = 2-layer student decoder
# Temperature = 1.0 (修复：原来是2.0，现在统一为1.0)
# Alpha = 2.0 (TCKD weight), Beta = 0.3 (NCKD weight), Gamma = 0.6 (CE weight)
# Top-k = 64 (non-target logits retained in NCKD)

model:
  teacher_model: "openai/whisper-large"
  student_decoder_layers: 2
  student_decoder_heads: 16
  student_hidden_size: 1024
  dropout: 0.1

data:
  dataset_name: "librispeech_asr"
  dataset_config: "clean"
  split: "train.100"
  num_samples: null
  max_duration: 10.0
  batch_size: 16
  num_workers: 8
  sample_rate: 16000

training:
  epochs: 15
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  gradient_clip: 1.0
  log_interval: 100
  eval_interval: 1000
  save_interval: 2000
  output_dir: "./outputs/large_dkd_s2_t1_g09"
  seed: 42
  fp16: true

dkd:
  temperature: 1.0  # 修复：从2.0改为1.0，与其他配置保持一致
  alpha: 2.0
  beta: 0.3
  gamma: 0.9
  topk: 64


